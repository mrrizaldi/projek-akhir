# Konfigurasi WordCraft untuk proyek LaTeX di folder ini (buku-pa, proposal-pa, progres-pa-1).
# Dibaca saat main.tex dibuka di WordCraft / dikonversi oleh `wordcraft-cli convert`.
# Jaga agar sejalan dengan shared/preamble.tex + shared/size-a4.tex.
# Dokumentasi kunci: docs/latex.md di repo WordCraft.

[page]
size = "A4"
margins_cm = { top = 3, bottom = 3, left = 4, right = 3 }
twoside = true

[body]
font = "Times New Roman"
size = 12
line_spacing = 1.5
first_line_in = 0.5
parskip = 0
indent_first = true

[heading.chapter]
label = "BAB {n}"
two_line = true
size = 14
bold = true
align = "center"
upper = true
before = 0
after = 12
odd_page = true

[heading.section]
number_box_in = 0.5
size = 12
bold = true
upper = true
before = 12
after = 6

[heading.subsection]
number_box_in = 0.5
size = 12
bold = true
before = 12
after = 6

[heading.subsubsection]
number = "{a}."
bold = false
before = 12
after = 6

[caption]
figure = "Gambar {ch}.{n}."
table = "Tabel {ch}.{n}."
bold = true
align = "center"
size = 12

[equation]
tag = "(Persamaan {ch}.{n})"
bold = true
indent_mm = 10

[env.kutipan]
left_mm = 10
right_mm = 10
size = 11

[lists]
label_indent_cm = 1

[front]
toc = "DAFTAR ISI"
lof = "DAFTAR GAMBAR"
lot = "DAFTAR TABEL"
bib = "DAFTAR PUSTAKA"
roman_front_matter = true

[footer]
page_number = "center"

[bib]
bbl = "output/main.bbl"

[tables]
style = "booktabs"
float = "[!ht]"

[sync]
comments = true
marker = "% MANUAL {date} (wordcraft sync): teks penulis, jangan diubah otomatis"
style_warnings = [";", ":", "—"]
