; env native khusus `pio test -e native` (tanpa main()). Tanpa default_envs,
; `pio run` polos ikut me-link native dan gagal "undefined reference to main".
[platformio]
default_envs = esp32-s3

; ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM). Profil board ini sudah membawa
; -DBOARD_HAS_PSRAM sendiri.
[env:esp32-s3]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_flags = -I test        ; golden_ref.h dipakai sumber sinyal replay
; Versi di Menu > Info = commit git saat build (hanya src/, pustaka tidak ikut
; dikompilasi ulang tiap commit).
build_src_flags = !echo "-DVERSI_GIT=\\\"$(git describe --always --dirty 2>/dev/null || echo tanpa-git)\\\""
; TFLite Micro: kernel referensi (belum ESP-NN); angka latensinya menjadi baseline.
; Adafruit ST7789 + GFX: TFT 172x320 (init SPI_MODE3, CS ke GND).
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.0

; Serial lewat USB-CDC bawaan S3 tidak diaktifkan; Serial berjalan lewat
; USB JTAG/serial. Aktifkan hanya bila monitor tidak menampilkan apa pun.
; build_flags =
;     -D ARDUINO_USB_CDC_ON_BOOT=1
;     -D ARDUINO_USB_MODE=1

; Test di board: pio test -e esp32-s3 (semua) atau -f <nama> (satu suite).
;   test_preproc, test_inference : matematika & inferensi di FPU sungguhan
;   test_hw_*                    : perangkat PCB (buzzer, TFT, ADC, INA219, integrasi)
test_build_src = yes                ; test memakai src/ (main.cpp kosong saat PIO_UNIT_TESTING)
test_filter = test_preproc, test_inference, test_hw_*

; Test di PC tanpa board: matematika murni, tanpa TFLM/Arduino.
[env:native]
platform = native
test_framework = unity
build_flags = -I include -std=c++17
test_build_src = yes
build_src_filter = +<ecg_pipeline.cpp> +<ecg_live.cpp> +<ina219.cpp> +<ecg_mqtt.cpp>
test_filter = test_preproc, test_ina219, test_mqtt
