; env native itu khusus `pio test -e native` (test_build_src, tanpa main()).
; Tanpa default_envs, `pio run` polos ikut me-link native dan gagal
; "undefined reference to main" — bukan error firmware.
[platformio]
default_envs = esp32-s3

; ESP32-S3 N16R8 (16MB flash, 8MB PSRAM).
; Board id diverifikasi dari projek uji yang BERHASIL di-build:
; ~/Documents/PlatformIO/Projects/tes (Jul 2026, tes tombol + NeoPixel).
; Profil board ini sudah membawa -DBOARD_HAS_PSRAM sendiri.
[env:esp32-s3]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_flags = -I test        ; golden_ref.h dipakai sumber sinyal replay (HW-7 Task 4)
; TFLite Micro. Dependency disetujui user (gate point CLAUDE.md).
; Kernel referensi, belum ESP-NN — angka latensinya jadi baseline; kalau terlalu
; lambat untuk ~1 inferensi per detak, pindah ke espressif/esp-tflite-micro.
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0

; Serial lewat USB-CDC bawaan S3. Di projek uji ini DI-COMMENT dan Serial tetap
; jalan lewat UART; aktifkan hanya kalau monitor tidak keluar apa-apa.
; build_flags =
;     -D ARDUINO_USB_CDC_ON_BOOT=1
;     -D ARDUINO_USB_MODE=1

; Uji preprocessing di PC, tanpa board: pio test -e native
; Cuma tahap 0-3 (matematika murni). Inferensi TFLite diuji di device.
; Test di device: preprocessing (FPU sungguhan) + inferensi TFLite Micro.
test_build_src = yes                ; test butuh src/ecg_pipeline.cpp
test_filter = test_preproc, test_inference
build_src_filter = +<*> -<hwtest.cpp>   ; hwtest punya setup()/loop() sendiri

; Uji hardware PCB rev1 di breadboard: AD8232 + TFT + buzzer pasif + tombol.
; Firmware utama tidak tersentuh. pio run -e hwtest -t upload
; HWTEST_SIM: 0 = ADC, 1 = dummy TERATUR (BPM diatur +/-), 2 = REKAMAN 208 aritmik.
; Ganti ke 0 kalau elektroda sudah siap; serial 'y' tetap bisa menukar saat jalan.
; Adafruit disetujui user (gate point CLAUDE.md), sama dengan
; sketch uji TFT yang sudah terbukti (init 172x320, SPI_MODE3, CS ke GND).
[env:hwtest]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_src_filter = +<hwtest.cpp> +<ecg_live.cpp> +<ecg_pipeline.cpp> +<ina219.cpp>
; ECG_LIVE_TIAP=90: deteksi tiap 250 ms -> bip 705 ms sesudah R (bawaan 1455 ms).
; Akurasi deteksi DS1 setara bawaan (Se 0,9881 vs 0,9867, PPV 0,9870 vs 0,9880);
; burst deteksi 7,2 ms per putaran di board = 2,9% CPU (diukur 11 Okt 2026).
; Hanya env hwtest yang memakai ECG_LIVE_TIAP=90; firmware utama memakai bawaan.
build_flags = -I test -D HWTEST_SIM=0 -D ECG_LIVE_TIAP=90   ; golden_ref.h = sumber replay
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.0

[env:native]
platform = native
test_framework = unity
build_flags = -I include -std=c++17
test_build_src = yes
build_src_filter = +<ecg_pipeline.cpp> +<ecg_live.cpp> +<ina219.cpp> +<ecg_mqtt.cpp>
test_filter = test_preproc, test_ina219, test_mqtt   ; native tidak punya TFLM/Arduino
